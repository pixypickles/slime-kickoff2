<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#8bd39b"><title>スライム・キックオフ2 試作版 v0.4</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dff3e2;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#fff}body{display:grid;place-items:center}#wrap{position:relative;width:min(100vw,calc(100vh*1.6667));height:min(100vh,calc(100vw*.6));max-width:1100px;max-height:660px;background:#8dcc96;overflow:hidden;box-shadow:0 10px 35px #6a8f7266}canvas{display:block;width:100%;height:100%}#hud{position:absolute;inset:0;pointer-events:none}#title{position:absolute;left:50%;top:1.5%;transform:translateX(-50%);font-weight:1000;font-size:clamp(13px,2vw,23px);text-shadow:0 2px 0 #ffffffaa,0 3px 5px #244d3566;white-space:nowrap}#score{position:absolute;left:50%;top:7%;transform:translateX(-50%);padding:4px 17px;border:4px solid #111;border-radius:999px;background:#fff;color:#111;font-weight:1000;font-size:clamp(15px,2.4vw,27px)}#msg{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);padding:6px 13px;border:3px solid #111;border-radius:999px;background:#fff;color:#111;font-weight:900;font-size:clamp(9px,1.25vw,14px);opacity:.94;white-space:nowrap}#stick{position:absolute;left:4%;bottom:7%;width:19%;aspect-ratio:1;border:4px solid #111;border-radius:50%;background:#ffffff55;pointer-events:auto}#knob{position:absolute;left:30%;top:30%;width:40%;height:40%;border:4px solid #111;border-radius:50%;background:#fff}#kick{position:absolute;right:5%;bottom:9%;width:17%;aspect-ratio:1;border:5px solid #111;border-radius:50%;background:#ee745b;color:#111;font-weight:1000;font-size:clamp(13px,2.2vw,24px);box-shadow:inset 0 -7px 0 #0003;pointer-events:auto}#kick:active{transform:translateY(3px)}#reset{position:absolute;right:2%;top:2%;border:3px solid #111;border-radius:12px;padding:7px 11px;background:#ffe07a;color:#111;font-weight:900;pointer-events:auto}#intro{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#d6f0dcf2,#bfe5c9f5);padding:18px;z-index:10}.card{width:min(740px,96%);padding:22px;border:5px solid #111;border-radius:26px;background:#f8edcf;color:#111;text-align:center;box-shadow:0 12px 0 #0005}h1{margin:0 0 5px;font-size:clamp(27px,5vw,52px)}.card p{margin:8px 0;line-height:1.5;font-weight:700}.card strong{color:#b43d2b}#start{margin-top:12px;border:5px solid #111;border-radius:18px;padding:12px 32px;background:#76c86d;color:#111;font-size:22px;font-weight:1000;cursor:pointer;box-shadow:inset 0 -6px 0 #0003}.note{font-size:12px;opacity:.75}.hidden{display:none!important}@media(orientation:portrait){#wrap{width:min(100dvh,calc(100dvw/.6));height:min(60dvh,100dvw);transform:rotate(90deg)}}
</style></head><body><div id="wrap"><canvas id="game" width="1000" height="600"></canvas><div id="hud"><div id="title">スライム・キックオフ2　PROTOTYPE v0.4</div><div id="score">0 - 0</div><div id="msg">着地点へ先回りして、キックの間合いを作ろう</div><div id="stick"><div id="knob"></div></div><button id="kick">キック</button><button id="reset">リセット</button></div><div id="intro"><div class="card"><h1>スライム・キックオフ2</h1><p>村と村の間に開いた異次元の湧き場から、少し臭うスライムが現れました。害はないので、普通の人間たちが蹴って隣村へ押しつけ合います。</p><p><strong>スライムはジャンプか、蹴られて飛ぶ時だけ移動。</strong><br>滑らず、転がらず、着地した瞬間に止まります。</p><p>青がプレイヤー、赤がCPU。先に3点で勝利です。</p><button id="start">試作を開始</button><p class="note">左スティック／WASD・矢印で移動、右ボタン／Spaceでキック。</p></div></div></div><script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
const intro=document.getElementById('intro'),start=document.getElementById('start'),reset=document.getElementById('reset'),kickBtn=document.getElementById('kick'),stick=document.getElementById('stick'),knob=document.getElementById('knob'),scoreEl=document.getElementById('score'),msg=document.getElementById('msg');
let running=false,last=0,keys={},joy={x:0,y:0,id:null},score=[0,0],freeze=0,shake=0,flash=0,portalTime=0;
const FIELD={cx:500,cy:315,rx:430,ry:235,goalT:255,goalB:375};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a),smooth=t=>t*t*(3-2*t),norm=(x,y)=>{const l=Math.hypot(x,y)||1;return{x:x/l,y:y/l}},dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function person(x,y,color,side){return{x,y,color,side,dirX:side,dirY:0,speed:168,kickT:-1,kickDone:false,walkT:0,moving:0,stun:0,aiT:0,kickCd:0,reposition:0}}
const player=person(250,355,'#56a9dc',1),cpu=person(750,275,'#e46f63',-1);
const slime={x:500,y:315,z:0,state:'idle',t:0,dur:0,sx:0,sy:0,tx:0,ty:0,h:0,next:.8,dodgeCd:0,squash:0,impactX:0,impactY:0};
function setMessage(t){msg.textContent=t}function updateScore(){scoreEl.textContent=`${score[0]} - ${score[1]}`}
function resetRound(){Object.assign(player,person(250,355,'#56a9dc',1));Object.assign(cpu,person(750,275,'#e46f63',-1));Object.assign(slime,{x:500,y:315,z:0,state:'idle',t:0,dur:0,sx:0,sy:0,tx:0,ty:0,h:0,next:.8,dodgeCd:0,squash:0,impactX:0,impactY:0});freeze=.45}
function resetGame(){score=[0,0];updateScore();resetRound();setMessage('着地点へ先回りして、キックの間合いを作ろう')}
function constrainEllipse(o,margin=0){const dx=o.x-FIELD.cx,dy=o.y-FIELD.cy,rx=FIELD.rx-margin,ry=FIELD.ry-margin,q=(dx*dx)/(rx*rx)+(dy*dy)/(ry*ry);if(q>1){const k=1/Math.sqrt(q);o.x=FIELD.cx+dx*k;o.y=FIELD.cy+dy*k}return o}
function slimeTarget(tx,ty){const inGoal=ty>FIELD.goalT&&ty<FIELD.goalB&&(tx<105||tx>895);if(inGoal)return{x:clamp(tx,30,W-30),y:clamp(ty,FIELD.goalT+8,FIELD.goalB-8)};return constrainEllipse({x:tx,y:ty},27)}
function launchSlime(tx,ty,h=40,dur=.48,state='jump'){const q=slimeTarget(tx,ty);slime.state=state;slime.t=0;slime.dur=dur;slime.sx=slime.x;slime.sy=slime.y;slime.tx=q.x;slime.ty=q.y;slime.h=h}
function requestKick(p){if(p.kickT<0&&p.stun<=0){p.kickT=0;p.kickDone=false}}
function kickCurve(t){if(t<.18)return t/.18;if(t<.38)return 1;if(t<.58)return 1-(t-.38)/.20*.08;if(t<.72)return .92+(t-.58)/.14*.08;return 1-(t-.72)/.28}
function performKick(p){const dx=slime.x-p.x,dy=slime.y-p.y,d=Math.hypot(dx,dy),f=(dx*p.dirX+dy*p.dirY)/(d||1);if(d>104||f<.50||slime.state==='dodge'||slime.z>20)return false;if(slime.state==='idle'&&slime.dodgeCd<=0&&Math.random()<.045){const away=norm(dx,dy);launchSlime(slime.x+away.x*25,slime.y+away.y*25,10,.18,'dodge');slime.dodgeCd=4;setMessage('ぷるっ！ スライムが小さく避けた');return false}const aim=norm(p.dirX*.85+dx/(d||1)*.15,p.dirY*.85+dy/(d||1)*.15),power=slime.state==='idle'?1:.82;launchSlime(slime.x+aim.x*rand(88,122)*power,slime.y+aim.y*rand(88,122)*power,rand(29,43)*power,rand(.43,.56),'kicked');slime.squash=1;slime.impactX=aim.x;slime.impactY=aim.y;shake=7;flash=.08;freeze=.045;setMessage(p===player?'当たった！ 軽く弧を描いて飛ぶ':'CPUに蹴られた。着地点へ回り込もう');return true}
function movePerson(p,mx,my,dt){const mag=Math.min(1,Math.hypot(mx,my));if(mag>.08&&p.kickT<0&&p.stun<=0){const n=norm(mx,my);p.dirX=lerp(p.dirX,n.x,.18);p.dirY=lerp(p.dirY,n.y,.18);const dn=norm(p.dirX,p.dirY);p.dirX=dn.x;p.dirY=dn.y;p.x+=n.x*p.speed*mag*dt;p.y+=n.y*p.speed*mag*dt;p.walkT+=dt*(6.7+mag*2);p.moving=lerp(p.moving,mag,.24)}else p.moving=lerp(p.moving,0,.2);constrainEllipse(p,42)}
function updateKick(p,dt){if(p.kickT<0)return;p.kickT+=dt;if(p.kickT>.46&&p.kickT<.62){p.x+=p.dirX*38*dt;p.y+=p.dirY*38*dt}if(!p.kickDone&&p.kickT>=.57){p.kickDone=true;performKick(p)}if(p.kickT>=.88)p.kickT=-1}
function updatePlayer(dt){let mx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)+joy.x,my=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0)+joy.y;movePerson(player,mx,my,dt);updateKick(player,dt)}
function updateCPU(dt){
 cpu.aiT-=dt;cpu.kickCd=Math.max(0,cpu.kickCd-dt);
 const goalX=48; // CPUは左村へ押しつけたい
 const toGoal=norm(goalX-slime.x,FIELD.cy-slime.y);
 // スライムの右側（自村側）へ回り込んでから左へ蹴る
 const behind={x:slime.x-toGoal.x*78,y:slime.y-toGoal.y*78};constrainEllipse(behind,48);
 const target=slime.state==='idle'?behind:{x:slime.tx-toGoal.x*72,y:slime.ty-toGoal.y*72};constrainEllipse(target,48);
 let dx=target.x-cpu.x,dy=target.y-cpu.y,d=Math.hypot(dx,dy),mx=0,my=0;
 if(cpu.kickT<0){
  if(d>33){const n=norm(dx,dy);mx=n.x;my=n.y}
  else{
   const sd=Math.hypot(slime.x-cpu.x,slime.y-cpu.y);cpu.dirX=toGoal.x;cpu.dirY=toGoal.y;
   if(cpu.aiT<=0&&cpu.kickCd<=0&&slime.state==='idle'&&sd<104){requestKick(cpu);cpu.aiT=rand(.7,1.05);cpu.kickCd=1.05}
  }
 }
 movePerson(cpu,mx,my,dt);updateKick(cpu,dt)
}
function updateSlime(dt){slime.dodgeCd=Math.max(0,slime.dodgeCd-dt);slime.squash=Math.max(0,slime.squash-dt*5);if(slime.state==='idle'){slime.z=0;slime.next-=dt;if(slime.next<=0){const bias=norm(rand(-.4,.4),rand(-1,1)),d=rand(34,67);launchSlime(slime.x+bias.x*d,slime.y+bias.y*d,rand(24,38),rand(.4,.56),'jump');slime.next=rand(.75,1.45)}return}slime.t+=dt;const p=clamp(slime.t/slime.dur,0,1),e=smooth(p);slime.x=lerp(slime.sx,slime.tx,e);slime.y=lerp(slime.sy,slime.ty,e);slime.z=Math.sin(p*Math.PI)*slime.h;if(p>=1){slime.x=slime.tx;slime.y=slime.ty;slime.z=0;slime.state='idle';slime.next=rand(.55,1.25);slime.squash=.45;checkGoal()}}
function checkGoal(){if(slime.y<FIELD.goalT||slime.y>FIELD.goalB)return;if(slime.x<54){score[1]++;goal(1)}else if(slime.x>946){score[0]++;goal(0)}}
function goal(side){updateScore();shake=16;freeze=.7;setMessage(side===0?'ゴール！ 青チームの得点':'ゴール。赤チームの得点');setTimeout(()=>{if(score[side]>=3){setMessage(side===0?'青チームの勝利！ リセットでもう一度':'赤チームの勝利。リセットで再挑戦');running=false}else resetRound()},700)}
function update(dt){portalTime+=dt;if(freeze>0){freeze-=dt;return}updatePlayer(dt);updateCPU(dt);updateSlime(dt);if(dist(player,cpu)<48){const n=norm(player.x-cpu.x,player.y-cpu.y),push=(48-dist(player,cpu))*.5;player.x+=n.x*push;player.y+=n.y*push;cpu.x-=n.x*push;cpu.y-=n.y*push}}
function limb(x1,y1,x2,y2,w,skin=true){ctx.strokeStyle='#111';ctx.lineWidth=w+6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.strokeStyle=skin?'#efb17e':'#f4f0df';ctx.lineWidth=w;ctx.stroke()}
function drawPerson(p){
 const x=p.x,y=p.y,bob=Math.sin(p.walkT*2)*1.8*p.moving,walk=Math.sin(p.walkT)*p.moving;
 // 見た目は常に横向き。上下移動中も最後に向いた左右を保持する。
 if(Math.abs(p.dirX)>.16)p.side=p.dirX>=0?1:-1;
 const f=p.side||1,kt=p.kickT<0?-1:clamp(p.kickT/.88,0,1);
 let bodyX=0,bodyY=0,lean=0;
 let supportHip={x:-7,y:-2},supportKnee={x:-10-walk*6,y:22},supportFoot={x:-13-walk*12,y:46};
 let kickHip={x:8,y:-1},kickKnee={x:12+walk*6,y:22},kickFoot={x:18+walk*12,y:45};
 let armFront={x:20,y:-39},handFront={x:27,y:-13},armBack={x:-17,y:-40},handBack={x:-25,y:-16};
 if(kt>=0){
  // 1 構え → 2 軸足を一歩前へ → 3 蹴り足を後方へ振り上げる
  // 4 少し前傾 → 5 膝を運ぶ → 6 振り抜き → 7 戻す
  if(kt<.18){const q=smooth(kt/.18);lean=lerp(0,-.06,q);supportFoot.x=lerp(-13,7,q);supportKnee.x=lerp(-10,1,q);bodyX=lerp(0,5,q)}
  else if(kt<.40){const q=smooth((kt-.18)/.22);lean=lerp(-.06,-.16,q);bodyX=lerp(5,10,q);supportFoot.x=7;supportKnee.x=1;kickKnee.x=lerp(12,-16,q);kickKnee.y=lerp(22,10,q);kickFoot.x=lerp(18,-34,q);kickFoot.y=lerp(45,8,q);handFront.x=lerp(27,9,q);handBack.x=lerp(-25,-38,q)}
  else if(kt<.56){const q=smooth((kt-.40)/.16);lean=lerp(-.16,-.23,q);bodyX=lerp(10,14,q);supportFoot.x=7;supportKnee.x=1;kickKnee.x=lerp(-16,18,q);kickKnee.y=lerp(10,14,q);kickFoot.x=lerp(-34,-8,q);kickFoot.y=lerp(8,26,q)}
  else if(kt<.72){const q=smooth((kt-.56)/.16);lean=lerp(-.23,-.14,q);bodyX=lerp(14,18,q);supportFoot.x=7;supportKnee.x=1;kickKnee.x=lerp(18,27,q);kickKnee.y=lerp(14,25,q);kickFoot.x=lerp(-8,55,q);kickFoot.y=lerp(26,38,q);handFront.x=lerp(9,34,q);handBack.x=lerp(-38,-12,q)}
  else{const q=smooth((kt-.72)/.28);lean=lerp(-.14,0,q);bodyX=lerp(18,0,q);supportFoot.x=lerp(7,-13,q);supportKnee.x=lerp(1,-10,q);kickKnee.x=lerp(27,12,q);kickKnee.y=lerp(25,22,q);kickFoot.x=lerp(55,18,q);kickFoot.y=lerp(38,45,q)}
 }
 ctx.save();ctx.translate(x,y+bob);ctx.scale(f,1);ctx.translate(bodyX,bodyY);ctx.rotate(lean);
 ctx.fillStyle='#355b4430';ctx.beginPath();ctx.ellipse(0,43,31,8,0,0,Math.PI*2);ctx.fill();
 // 奥側の腕と脚を先に描く。
 limb(-8,-2,supportKnee.x,supportKnee.y,12);limb(supportKnee.x,supportKnee.y,supportFoot.x-2,supportFoot.y-5,11,false);
 ctx.fillStyle='#fffdf3';ctx.strokeStyle='#161616';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(supportFoot.x,supportFoot.y,15,8,-.25,0,Math.PI*2);ctx.fill();ctx.stroke();
 limb(-14,-55,armBack.x,armBack.y,10);limb(armBack.x,armBack.y,handBack.x,handBack.y,9);
 // 横向きの胴体。胸側を少し前へ出す。
 ctx.fillStyle=p.color;ctx.strokeStyle='#161616';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-19,-74);ctx.quadraticCurveTo(9,-79,25,-62);ctx.lineTo(19,-7);ctx.quadraticCurveTo(0,3,-20,-6);ctx.closePath();ctx.fill();ctx.stroke();
 limb(13,-57,armFront.x,armFront.y,10);limb(armFront.x,armFront.y,handFront.x,handFront.y,9);
 limb(7,-1,kickKnee.x,kickKnee.y,12);limb(kickKnee.x,kickKnee.y,kickFoot.x-5,kickFoot.y-5,11);
 ctx.fillStyle='#fffdf3';ctx.strokeStyle='#161616';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(kickFoot.x,kickFoot.y,17,8,-.10,0,Math.PI*2);ctx.fill();ctx.stroke();
 // 横顔。前方へ少し張り出し、見える目は一つ。
 ctx.fillStyle='#f3b786';ctx.strokeStyle='#161616';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-22,-126);ctx.quadraticCurveTo(4,-141,27,-124);ctx.quadraticCurveTo(38,-110,27,-91);ctx.quadraticCurveTo(9,-78,-20,-88);ctx.quadraticCurveTo(-33,-105,-22,-126);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle='#161616';ctx.beginPath();ctx.arc(15,-108,5.5,0,Math.PI*2);ctx.fill();ctx.restore()
}
function drawSlime(){const landSquash=slime.squash,air=Math.sin(clamp(slime.t/(slime.dur||1),0,1)*Math.PI),x=slime.x,y=slime.y-slime.z;ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(slime.x,slime.y+17,34*(1-slime.z/240),10*(1-slime.z/240),0,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(x,y);let sx=1+landSquash*.24-air*.08,sy=1-landSquash*.20+air*.08;ctx.scale(sx,sy);ctx.fillStyle='#8ad968';ctx.strokeStyle='#111';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-34,17);ctx.quadraticCurveTo(-31,-22,0,-31);ctx.quadraticCurveTo(31,-22,34,17);ctx.quadraticCurveTo(18,34,0,30);ctx.quadraticCurveTo(-18,34,-34,17);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-11,-4,4.7,0,Math.PI*2);ctx.arc(11,-4,4.7,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawField(){
 const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#b7df9a');g.addColorStop(.47,'#8fd2ad');g.addColorStop(.53,'#8fd2ad');g.addColorStop(1,'#e1bd94');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // 左右の村。異次元空間の外側にあり、破れた門でつながる。
 ctx.fillStyle='#9dce7f';ctx.fillRect(0,0,126,H);ctx.fillStyle='#d5a97d';ctx.fillRect(W-126,0,126,H);
 for(let i=0;i<7;i++){ctx.fillStyle=i%2?'#d9c184':'#b99960';ctx.fillRect(18,80+i*72,70,42);ctx.fillStyle=i%2?'#c88963':'#d1a66c';ctx.fillRect(W-88,80+i*72,70,42)}
 // 異次元に削られた楕円形の競技場。
 ctx.save();ctx.translate(FIELD.cx,FIELD.cy);ctx.fillStyle='#9077ad';ctx.beginPath();ctx.ellipse(0,0,FIELD.rx+24,FIELD.ry+24,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#5c4873';ctx.lineWidth=9;ctx.stroke();ctx.restore();
 ctx.save();ctx.beginPath();ctx.ellipse(FIELD.cx,FIELD.cy,FIELD.rx,FIELD.ry,0,0,Math.PI*2);ctx.clip();
 const dirt=ctx.createRadialGradient(FIELD.cx,FIELD.cy,30,FIELD.cx,FIELD.cy,FIELD.rx);dirt.addColorStop(0,'#b5d99c');dirt.addColorStop(.65,'#8fc996');dirt.addColorStop(1,'#72ae86');ctx.fillStyle=dirt;ctx.fillRect(55,70,890,490);
 for(let i=0;i<64;i++){const a=i*2.399,r=Math.sqrt((i+2)/66),x=FIELD.cx+Math.cos(a)*FIELD.rx*.9*r,y=FIELD.cy+Math.sin(a)*FIELD.ry*.88*r;ctx.globalAlpha=.16+(i%4)*.05;ctx.fillStyle=i%2?'#f3eac0':'#4f8e69';ctx.beginPath();ctx.ellipse(x,y,3+i%4,2+i%3,a,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 ctx.strokeStyle='#fffde0dd';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(FIELD.cx,FIELD.cy,FIELD.rx-22,FIELD.ry-22,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([13,11]);ctx.beginPath();ctx.moveTo(FIELD.cx,96);ctx.lineTo(FIELD.cx,534);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(FIELD.cx,FIELD.cy,70,0,Math.PI*2);ctx.stroke();ctx.restore();
 // 村へ抜けるゴール通路。角は存在しない。
 ctx.fillStyle='#d5a566';ctx.strokeStyle='#111';ctx.lineWidth=6;ctx.fillRect(27,FIELD.goalT,70,FIELD.goalB-FIELD.goalT);ctx.strokeRect(27,FIELD.goalT,70,FIELD.goalB-FIELD.goalT);ctx.fillRect(W-97,FIELD.goalT,70,FIELD.goalB-FIELD.goalT);ctx.strokeRect(W-97,FIELD.goalT,70,FIELD.goalB-FIELD.goalT);
 ctx.strokeStyle='#f6e8b6';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(96,FIELD.goalT);ctx.lineTo(96,FIELD.goalB);ctx.moveTo(W-96,FIELD.goalT);ctx.lineTo(W-96,FIELD.goalB);ctx.stroke();
 // 中央の湧き場。

function draw(){ctx.save();if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake*=.82;if(shake<.3)shake=0}ctx.clearRect(-30,-30,W+60,H+60);drawField();[{y:slime.y,fn:drawSlime},{y:player.y,fn:()=>drawPerson(player)},{y:cpu.y,fn:()=>drawPerson(cpu)}].sort((a,b)=>a.y-b.y).forEach(o=>o.fn());if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*5})`;ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-.02)}ctx.restore()}
