<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17232d">
<title>スライム・キックオフ2 試作版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:white}
body{display:grid;place-items:center}
#wrap{position:relative;width:min(100vw,calc(100vh*1.6667));height:min(100vh,calc(100vw*.6));max-width:1100px;max-height:660px;background:#315f46;overflow:hidden;box-shadow:0 0 35px #0009}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none}
#title{position:absolute;left:50%;top:2%;transform:translateX(-50%);font-weight:1000;font-size:clamp(15px,2.4vw,26px);text-shadow:0 3px 0 #0008;white-space:nowrap}
#msg{position:absolute;left:50%;top:10%;transform:translateX(-50%);padding:7px 14px;border:3px solid #111;border-radius:999px;background:#fff;color:#111;font-weight:900;font-size:clamp(10px,1.5vw,15px);opacity:.96;white-space:nowrap}
#stick{position:absolute;left:4%;bottom:7%;width:19%;aspect-ratio:1;border:4px solid #111;border-radius:50%;background:#ffffff55;pointer-events:auto}
#knob{position:absolute;left:30%;top:30%;width:40%;height:40%;border:4px solid #111;border-radius:50%;background:#fff}
#kick{position:absolute;right:5%;bottom:9%;width:17%;aspect-ratio:1;border:5px solid #111;border-radius:50%;background:#ee745b;color:#111;font-weight:1000;font-size:clamp(13px,2.4vw,25px);box-shadow:inset 0 -7px 0 #0003;pointer-events:auto}
#kick:active{transform:translateY(3px)}
#reset{position:absolute;right:2%;top:2%;border:3px solid #111;border-radius:12px;padding:7px 11px;background:#ffe07a;color:#111;font-weight:900;pointer-events:auto}
#intro{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#142631ee,#101820f7);padding:18px;z-index:10}
.card{width:min(720px,96%);padding:24px;border:5px solid #111;border-radius:26px;background:#f8edcf;color:#111;text-align:center;box-shadow:0 12px 0 #0005}
h1{margin:0 0 5px;font-size:clamp(27px,5vw,52px)}
.card p{margin:9px 0;line-height:1.55;font-weight:700}.card strong{color:#b43d2b}
#start{margin-top:12px;border:5px solid #111;border-radius:18px;padding:12px 32px;background:#76c86d;color:#111;font-size:22px;font-weight:1000;cursor:pointer;box-shadow:inset 0 -6px 0 #0003}
.note{font-size:12px;opacity:.75}
.hidden{display:none!important}
@media(orientation:portrait){#wrap{width:min(100dvh,calc(100dvw/.6));height:min(60dvh,100dvw);transform:rotate(90deg)}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="1000" height="600"></canvas>
<div id="hud">
<div id="title">スライム・キックオフ2　PROTOTYPE v0.1</div>
<div id="msg">スライムの着地点を読んで、ゆっくり蹴ろう</div>
<div id="stick"><div id="knob"></div></div>
<button id="kick">キック</button>
<button id="reset">リセット</button>
</div>
<div id="intro">
<div class="card">
<h1>スライム・キックオフ2</h1>
<p>特殊能力なし。普通の人間が、跳ねるスライムを蹴って競う試作版です。</p>
<p><strong>スライムは絶対に滑らず、転がりません。</strong><br>自分で跳ぶか、蹴られて弧を描いて飛ぶだけです。</p>
<p>人間は目だけの顔、太い黒線、肘と膝あり。キックは5段階のゆっくりしたモーションです。</p>
<button id="start">試作を開始</button>
<p class="note">左のスティックで移動／右のボタンでキック。キーボードは矢印・WASD＋Space。</p>
</div>
</div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const intro=document.getElementById('intro'),start=document.getElementById('start'),reset=document.getElementById('reset'),kickBtn=document.getElementById('kick');
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
let running=false,last=0,keys={},joy={x:0,y:0,id:null};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const norm=(x,y)=>{const l=Math.hypot(x,y)||1;return{x:x/l,y:y/l}};

const player={x:270,y:350,dirX:1,dirY:0,speed:185,kickPhase:0,kickT:0,kickHit:false};
const slime={x:545,y:325,z:0,state:'idle',t:0,dur:0,sx:0,sy:0,tx:0,ty:0,h:0,next:1.0,dodgeCd:0};

function resetGame(){
 Object.assign(player,{x:270,y:350,dirX:1,dirY:0,kickPhase:0,kickT:0,kickHit:false});
 Object.assign(slime,{x:545,y:325,z:0,state:'idle',t:0,dur:0,sx:0,sy:0,tx:0,ty:0,h:0,next:1.0,dodgeCd:0});
}
function startJump(tx,ty,h=38,dur=.45,state='jump'){
 slime.state=state;slime.t=0;slime.dur=dur;slime.sx=slime.x;slime.sy=slime.y;
 slime.tx=clamp(tx,95,W-95);slime.ty=clamp(ty,105,H-75);slime.h=h;
}
function maybeSlimeJump(dt){
 if(slime.state!=='idle')return;
 slime.next-=dt;if(slime.next>0)return;
 const a=rand(0,Math.PI*2),d=rand(38,72);
 startJump(slime.x+Math.cos(a)*d,slime.y+Math.sin(a)*d,rand(25,42),rand(.38,.56),'jump');
 slime.next=rand(.7,1.5);
}
function requestKick(){if(player.kickPhase===0){player.kickPhase=1;player.kickT=0;player.kickHit=false}}
function kickProgress(){return player.kickT/.82}
function updatePlayer(dt){
 let mx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)+joy.x;
 let my=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0)+joy.y;
 const n=norm(mx,my),mag=Math.min(1,Math.hypot(mx,my));
 if(mag>.08&&player.kickPhase===0){player.dirX=n.x;player.dirY=n.y;player.x+=n.x*player.speed*mag*dt;player.y+=n.y*player.speed*mag*dt}
 player.x=clamp(player.x,70,W-70);player.y=clamp(player.y,105,H-55);
 if(player.kickPhase){
   player.kickT+=dt;const p=kickProgress();
   if(!player.kickHit&&p>=.69){player.kickHit=true;performKick()}
   if(player.kickT>=.82){player.kickPhase=0;player.kickT=0}
 }
}
function performKick(){
 const dx=slime.x-player.x,dy=slime.y-player.y,d=Math.hypot(dx,dy);
 const facing=(dx*player.dirX+dy*player.dirY)/(d||1);
 if(d<112&&facing>.35&&slime.state==='idle'){
   if(slime.dodgeCd<=0&&Math.random()<.055){
     const a=norm(dx,dy);startJump(slime.x+a.x*27,slime.y+a.y*27,11,.19,'dodge');slime.dodgeCd=3.5;return;
   }
   const dir=norm(player.dirX,player.dirY),dist=rand(85,135);
   startJump(slime.x+dir.x*dist,slime.y+dir.y*dist,rand(34,52),rand(.40,.55),'kicked');
 }
}
function updateSlime(dt){
 slime.dodgeCd=Math.max(0,slime.dodgeCd-dt);
 if(slime.state==='idle'){slime.z=0;maybeSlimeJump(dt);return}
 slime.t+=dt;const p=clamp(slime.t/slime.dur,0,1),e=p*p*(3-2*p);
 slime.x=lerp(slime.sx,slime.tx,e);slime.y=lerp(slime.sy,slime.ty,e);slime.z=Math.sin(p*Math.PI)*slime.h;
 if(p>=1){slime.x=slime.tx;slime.y=slime.ty;slime.z=0;slime.state='idle';slime.next=rand(.55,1.35)}
}
function thickLine(x1,y1,x2,y2,w=11){ctx.strokeStyle='#111';ctx.lineWidth=w+6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.strokeStyle='#f1b47f';ctx.lineWidth=w;ctx.stroke()}
function drawPerson(){
 const x=player.x,y=player.y;ctx.save();ctx.translate(x,y);
 const a=Math.atan2(player.dirY,player.dirX);ctx.rotate(a*.10);
 let p=player.kickPhase?kickProgress():0;
 let lean=0,hipShift=0,knee=0,footX=0,footY=0;
 if(p>0){
  if(p<.18){lean=-.05*(p/.18)}
  else if(p<.38){let q=(p-.18)/.20;lean=-.05-.10*q;knee=.55*q;hipShift=-5*q}
  else if(p<.62){let q=(p-.38)/.24;lean=-.15+.20*q;knee=.55+.45*q;footX=-18*q;footY=-8*q}
  else if(p<.75){let q=(p-.62)/.13;lean=.05+.18*q;knee=1-q;footX=lerp(-18,68,q);footY=lerp(-8,-25,q)}
  else {let q=(p-.75)/.25;lean=.23*(1-q);footX=lerp(68,12,q);footY=lerp(-25,0,q)}
 }
 ctx.rotate(lean);ctx.translate(hipShift,0);
 // shadow
 ctx.save();ctx.rotate(-lean);ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(0,32,31,10,0,0,Math.PI*2);ctx.fill();ctx.restore();
 // back leg with knee
 thickLine(-8,1,-14,24,11);thickLine(-14,24,-24,42,11);
 // torso
 ctx.fillStyle='#57a7db';ctx.strokeStyle='#111';ctx.lineWidth=6;roundRect(-25,-72,50,66,18);ctx.fill();ctx.stroke();
 // arms
 thickLine(-20,-57,-33,-31,10);thickLine(-33,-31,-25,-11,9);
 thickLine(20,-57,31,-31,10);thickLine(31,-31,25,-9,9);
 // kicking leg: explicit thigh -> knee -> shin -> foot
 const hipX=9,hipY=-4;
 let kneeX=19-18*knee,kneeY=20-4*knee;
 let toeX=25+footX,toeY=42+footY;
 thickLine(hipX,hipY,kneeX,kneeY,12);thickLine(kneeX,kneeY,toeX-6,toeY-5,11);
 ctx.fillStyle='#f4f0df';ctx.strokeStyle='#111';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(toeX,toeY,17,9,-.15,0,Math.PI*2);ctx.fill();ctx.stroke();
 // head
 ctx.fillStyle='#f1b47f';ctx.strokeStyle='#111';ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,-103,32,0,Math.PI*2);ctx.fill();ctx.stroke();
 // eyes only
 const ex=player.dirX*3,ey=player.dirY*2;ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-10+ex,-106+ey,4.8,0,Math.PI*2);ctx.arc(10+ex,-106+ey,4.8,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawSlime(){
 const x=slime.x,y=slime.y-slime.z;
 ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(slime.x,slime.y+15,34*(1-slime.z/250),11*(1-slime.z/250),0,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.translate(x,y);
 const squash=slime.state==='idle'?1:1+Math.sin((slime.t/slime.dur)*Math.PI)*.08;
 ctx.scale(1/squash,squash);
 ctx.fillStyle='#8ad968';ctx.strokeStyle='#111';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-34,17);ctx.quadraticCurveTo(-31,-22,0,-31);ctx.quadraticCurveTo(31,-22,34,17);ctx.quadraticCurveTo(18,34,0,30);ctx.quadraticCurveTo(-18,34,-34,17);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-11,-4,4.5,0,Math.PI*2);ctx.arc(11,-4,4.5,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawField(){
 ctx.fillStyle='#4b8b5f';ctx.fillRect(0,0,W,H);
 for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#ffffff08':'#00000006';ctx.fillRect(i*100,0,100,H)}
 ctx.strokeStyle='#f6ecc9';ctx.lineWidth=7;ctx.strokeRect(47,70,W-94,H-115);
 ctx.beginPath();ctx.moveTo(W/2,70);ctx.lineTo(W/2,H-45);ctx.stroke();
 ctx.beginPath();ctx.arc(W/2,315,88,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle='#d8b572';ctx.strokeStyle='#111';ctx.lineWidth=5;ctx.fillRect(36,248,23,134);ctx.strokeRect(36,248,23,134);ctx.fillRect(W-59,248,23,134);ctx.strokeRect(W-59,248,23,134);
}
function draw(){ctx.clearRect(0,0,W,H);drawField();const objs=[{y:slime.y,fn:drawSlime},{y:player.y,fn:drawPerson}].sort((a,b)=>a.y-b.y);objs.forEach(o=>o.fn())}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(running){updatePlayer(dt);updateSlime(dt);draw()}requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();requestKick()}});window.addEventListener('keyup',e=>keys[e.code]=false);
function joyMove(e){if(joy.id===null)return;const p=[...e.touches].find(t=>t.identifier===joy.id);if(!p)return;const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=p.clientX-cx,dy=p.clientY-cy,max=r.width*.31,l=Math.hypot(dx,dy)||1,k=Math.min(max,l)/l;joy.x=dx/max*k;joy.y=dy/max*k;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`}
stick.addEventListener('touchstart',e=>{joy.id=e.changedTouches[0].identifier;joyMove(e)},{passive:false});stick.addEventListener('touchmove',e=>{e.preventDefault();joyMove(e)},{passive:false});
function joyEnd(e){if([...e.changedTouches].some(t=>t.identifier===joy.id)){joy={x:0,y:0,id:null};knob.style.transform=''}}
stick.addEventListener('touchend',joyEnd);stick.addEventListener('touchcancel',joyEnd);
kickBtn.addEventListener('pointerdown',e=>{e.preventDefault();requestKick()});reset.addEventListener('click',resetGame);start.addEventListener('click',()=>{intro.classList.add('hidden');running=true;last=performance.now();resetGame()});
draw();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
