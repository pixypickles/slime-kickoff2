</style></head><body><div id="wrap"><canvas id="game" width="1000" height="600"></canvas><div id="hud"><div id="title">スライム・キックオフ2　REBUILD v0.6.6</div><div id="score">0 - 0</div><div id="msg">弱・強・ジャンプ。スライムの高さで技が変わる</div><div id="stick"><div id="knob"></div></div><button id="jump">ジャンプ</button><button id="weak">弱</button><button id="strong">強</button><button id="reset">リセット</button></div><div id="intro"><div class="card"><h1>スライム・キックオフ2</h1><p>村と村の間の異次元から、無害だけど少し臭うスライムが湧き出した。両村は今日も、隣村へ押しつけ合う。</p><p><strong>攻撃システムを全面的に作り直しました。</strong></p><div class="attacks"><div><b class="red">地上・弱</b>その場で膝を曲げて素早く蹴る</div><div><b class="blue">地上・強</b>軸足を一歩踏み込んで強く蹴る</div><div><b class="red">浮いたスライム・弱</b>前へ踏み込むストレート</div><div><b class="blue">浮いたスライム・強</b>脚を畳んで横蹴り</div><div><b class="red">ジャンプ中・弱</b>ヘディング</div><div><b class="blue">ジャンプ中・強</b>二段蹴り風のジャンプキック</div></div><button id="start">開始</button><p class="note">移動：左スティック／WASD・矢印　弱：Z／赤　強：C／青　ジャンプ：X／黄</p></div></div></div>
<script>
(()=>{'use strict';
const C=document.getElementById('game'),g=C.getContext('2d'),W=C.width,H=C.height;
const $=id=>document.getElementById(id),intro=$('intro'),start=$('start'),reset=$('reset'),weakBtn=$('weak'),strongBtn=$('strong'),jumpBtn=$('jump'),stick=$('stick'),knob=$('knob'),scoreEl=$('score'),msg=$('msg');
let running=false,last=0,keys={},joy={x:0,y:0,id:null},score=[0,0],freeze=0,shake=0,flash=0,time=0;
const FIELD={cx:500,cy:315,rx:442,ry:246,goalT:250,goalB:380};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,smooth=t=>t*t*(3-2*t),rand=(a,b)=>a+Math.random()*(b-a),norm=(x,y)=>{const l=Math.hypot(x,y)||1;return{x:x/l,y:y/l}},dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const obstacles=[{type:'tree',x:320,y:205,r:29},{type:'rock',x:675,y:205,r:27},{type:'grass',x:410,y:438,rx:75,ry:34},{type:'grass',x:600,y:185,rx:72,ry:34},{type:'step',x:505,y:455,w:180,h:58,z:26},{type:'seesaw',x:500,y:310,len:180,tilt:0}];
function makePerson(x,y,color,side,ai=false){return{x,y,z:0,vz:0,onGround:true,platformZ:0,color,side,face:side,dirX:side,dirY:0,speed:176,walkT:0,moving:0,attack:null,attackT:0,hitDone:false,stun:0,cool:0,ai,aiThink:0}}
const player=makePerson(240,355,'#57a9dc',1),cpu=makePerson(760,270,'#e57368',-1,true);
const slime={x:500,y:315,z:0,state:'idle',t:0,dur:0,sx:0,sy:0,sz:0,tx:0,ty:0,tz:0,h:0,next:.9,squash:0,dodgeCd:0};
function say(t){msg.textContent=t}function updateScore(){scoreEl.textContent=`${score[0]} - ${score[1]}`}
function resetRound(){Object.assign(player,makePerson(240,355,'#57a9dc',1));Object.assign(cpu,makePerson(760,270,'#e57368',-1,true));Object.assign(slime,{x:500,y:315,z:0,state:'idle',t:0,dur:0,sx:0,sy:0,sz:0,tx:0,ty:0,tz:0,h:0,next:.9,squash:0,dodgeCd:0});freeze=.35}
function resetGame(){score=[0,0];updateScore();resetRound();say('弱・強・ジャンプ。スライムの高さで技が変わる')}
function constrain(o,margin=0){const dx=o.x-FIELD.cx,dy=o.y-FIELD.cy,rx=FIELD.rx-margin,ry=FIELD.ry-margin,q=dx*dx/(rx*rx)+dy*dy/(ry*ry);if(q>1){const k=1/Math.sqrt(q);o.x=FIELD.cx+dx*k;o.y=FIELD.cy+dy*k}}
function inRect(x,y,o,p=0){return x>o.x-o.w/2-p&&x<o.x+o.w/2+p&&y>o.y-o.h/2-p&&y<o.y+o.h/2+p}
function groundAt(x,y){let z=0;for(const o of obstacles)if(o.type==='step'&&inRect(x,y,o,-3))z=Math.max(z,o.z);return z}
function grassAt(x,y){return obstacles.some(o=>o.type==='grass'&&((x-o.x)**2/o.rx**2+(y-o.y)**2/o.ry**2<1))}
function resolveSolid(p,ox,oy){if(p.z>18)return;for(const o of obstacles){if(o.type!=='tree'&&o.type!=='rock')continue;const rr=o.r+20,dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy);if(d<rr){if(d<1){p.x=ox;p.y=oy}else{p.x=o.x+dx/d*rr;p.y=o.y+dy/d*rr}}}for(const o of obstacles)if(o.type==='step'&&inRect(p.x,p.y,o,17)&&p.z<o.z-4&&p.platformZ<o.z){p.x=ox;p.y=oy}}
function launch(tx,ty,h,dur,state='hit',tz=0){const q={x:tx,y:ty};const goal=q.y>FIELD.goalT&&q.y<FIELD.goalB&&(q.x<95||q.x>905);if(!goal)constrain(q,24);else{q.x=clamp(q.x,30,W-30);q.y=clamp(q.y,FIELD.goalT+8,FIELD.goalB-8)}Object.assign(slime,{state,t:0,dur,sx:slime.x,sy:slime.y,sz:slime.z,tx:q.x,ty:q.y,tz,h})}
function jump(p){if(p.onGround&&!p.attack&&p.stun<=0){p.onGround=false;p.vz=300;say('ジャンプ中は弱でヘディング、強で二段蹴り')}}
function chooseAttack(p,strength){if(p.attack||p.stun>0||p.cool>0)return;const selfAir=!p.onGround||p.z>8,slimeAir=slime.z>28||slime.state!=='idle';let kind;if(selfAir)kind=strength==='weak'?'airHead':'double';else if(slimeAir)kind=strength==='weak'?'straight':'sideKick';else kind=strength==='weak'?'groundWeak':'groundStrong';p.attack={kind,strength};p.attackT=0;p.hitDone=false;p.cool=.1}
const ATT={groundWeak:{dur:.48,hit:.24,range:102,power:145,height:62,msg:'地上弱：素早い蹴り'},groundStrong:{dur:.82,hit:.52,range:120,power:245,height:105,msg:'地上強：踏み込みキック'},straight:{dur:.52,hit:.29,range:116,power:150,height:76,msg:'空中弱：ストレート'},sideKick:{dur:.72,hit:.43,range:132,power:252,height:112,msg:'空中強：横蹴り'},double:{dur:.82,hit:.48,range:126,power:242,height:152,msg:'ジャンプ強：二段蹴り'},airHead:{dur:.50,hit:.24,range:105,power:185,height:100,msg:'ジャンプ弱：ヘディング'}};
function hitAttack(p){const a=ATT[p.attack.kind],dx=slime.x-p.x,dy=slime.y-p.y,d=Math.hypot(dx,dy),n=norm(dx,dy),f=(dx*p.dirX+dy*p.dirY)/(d||1);if(d>a.range||f<.12||Math.abs((p.z+44)-slime.z)>105)return false;if(slime.state==='idle'&&slime.dodgeCd<=0&&Math.random()<.035&&p.attack.kind!=='airBack'){const away=norm(dx,dy);launch(slime.x+away.x*28,slime.y+away.y*28,16,.22,'dodge');slime.dodgeCd=4;say('ぷるっ！ 小さなバックステップ');return false}let aim=norm(p.dirX*.82+n.x*.18,p.dirY*.82+n.y*.18),power=a.power,height=a.height,dur=.58+power/620;if(p.attack.kind==='straight'){power=158;height=82;dur=.54}if(p.attack.kind==='sideKick'){power=270;height=118;dur=.65}if(p.attack.kind==='airHead'){aim=norm(aim.x,aim.y);height=115}if(p.attack.kind==='double'){power=260;height=158;dur=.68}launch(slime.x+aim.x*power,slime.y+aim.y*power,height,dur,p.attack.kind);slime.squash=1;shake=p.attack.strength==='strong'?13:7;flash=.1;freeze=p.attack.strength==='strong'?.055:.025;say(a.msg);return true}
function updateAttack(p,dt){if(!p.attack)return;const a=ATT[p.attack.kind];p.attackT+=dt;if(p.attack.kind==='groundStrong'&&p.attackT>.18&&p.attackT<.40){p.x+=p.dirX*54*dt;p.y+=p.dirY*54*dt}if(p.attack.kind==='straight'&&p.attackT>.12&&p.attackT<.31){p.x+=p.dirX*42*dt;p.y+=p.dirY*42*dt}if(p.attack.kind==='sideKick'&&p.attackT>.18&&p.attackT<.46){p.x+=p.dirX*54*dt;p.y+=p.dirY*54*dt}if(p.attack.kind==='double'&&p.attackT>.15&&p.attackT<.50){p.x+=p.dirX*72*dt;p.y+=p.dirY*72*dt}if(!p.hitDone&&p.attackT>=a.hit){p.hitDone=true;hitAttack(p)}if(p.attackT>=a.dur){p.attack=null;p.attackT=0;p.cool=.16}constrain(p,38)}
function move(p,mx,my,dt){const mag=Math.min(1,Math.hypot(mx,my));if(mag>.08&&!p.attack&&p.stun<=0){const n=norm(mx,my);if(Math.abs(n.x)>.12)p.face=n.x>=0?1:-1;p.dirX=lerp(p.dirX,n.x,.24);p.dirY=lerp(p.dirY,n.y,.24);const dn=norm(p.dirX,p.dirY);p.dirX=dn.x;p.dirY=dn.y;const speed=p.speed*(grassAt(p.x,p.y)?.64:1)*(p.onGround?1:.72),ox=p.x,oy=p.y;p.x+=n.x*speed*mag*dt;p.y+=n.y*speed*mag*dt;resolveSolid(p,ox,oy);p.walkT+=dt*(6.8+mag*2);p.moving=lerp(p.moving,mag,.25)}else p.moving=lerp(p.moving,0,.18);constrain(p,38)}
function vertical(p,dt){if(!p.onGround){p.vz-=660*dt;p.z+=p.vz*dt;const gh=groundAt(p.x,p.y);if(p.z<=gh){p.z=gh;p.platformZ=gh;p.vz=0;p.onGround=true}}else{const gh=groundAt(p.x,p.y);if(gh<p.platformZ-3){p.onGround=false;p.vz=0}else{p.z=gh;p.platformZ=gh}}}
function playerUpdate(dt){const mx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)+joy.x,my=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0)+joy.y;move(player,mx,my,dt);vertical(player,dt);updateAttack(player,dt);player.cool=Math.max(0,player.cool-dt);player.stun=Math.max(0,player.stun-dt)}
function cpuUpdate(dt){cpu.aiThink-=dt;const dx=slime.x-cpu.x,dy=slime.y-cpu.y,d=Math.hypot(dx,dy);let mx=0,my=0;if(!cpu.attack&&cpu.stun<=0){const behind={x:slime.x+120,y:slime.y};const target=d<150?behind:slime;mx=target.x-cpu.x;my=target.y-cpu.y;if(d<118&&Math.abs(slime.z-(cpu.z+40))<105&&cpu.cool<=0){const strong=Math.random()<.58;chooseAttack(cpu,strong?'strong':'weak')}else if(slime.z>70&&d<175&&cpu.onGround&&Math.random()<.015)jump(cpu);move(cpu,mx,my,dt)}vertical(cpu,dt);updateAttack(cpu,dt);cpu.cool=Math.max(0,cpu.cool-dt);cpu.stun=Math.max(0,cpu.stun-dt)}
function slimeUpdate(dt){slime.dodgeCd=Math.max(0,slime.dodgeCd-dt);slime.squash=Math.max(0,slime.squash-dt*4);if(slime.state==='idle'){slime.next-=dt;if(slime.next<=0){const a=rand(0,Math.PI*2),r=rand(45,82);launch(slime.x+Math.cos(a)*r,slime.y+Math.sin(a)*r,rand(38,60),rand(.48,.65),'jump');slime.next=rand(.65,1.3)}return}slime.t+=dt;const p=clamp(slime.t/slime.dur,0,1),e=smooth(p);slime.x=lerp(slime.sx,slime.tx,e);slime.y=lerp(slime.sy,slime.ty,e);slime.z=lerp(slime.sz,slime.tz,e)+Math.sin(Math.PI*p)*slime.h;const ss=obstacles.find(o=>o.type==='seesaw');if(p>.78&&Math.abs(slime.x-ss.x)<ss.len/2&&Math.abs(slime.y-ss.y)<28&&slime.z<34){ss.tilt=clamp((slime.x-ss.x)/(ss.len/2),-1,1);launch(slime.x+(slime.x<ss.x?-125:125),slime.y-25,185,.82,'seesaw');say('シーソーで大ジャンプ！');return}if(p>=1){slime.x=slime.tx;slime.y=slime.ty;slime.z=groundAt(slime.x,slime.y);slime.state='idle';slime.next=rand(.55,1.15);slime.squash=.55;checkGoal()}}
function checkGoal(){if(slime.y<FIELD.goalT||slime.y>FIELD.goalB)return;if(slime.x<53){score[1]++;goal(1)}else if(slime.x>947){score[0]++;goal(0)}}function goal(side){updateScore();shake=17;freeze=.65;say(side===0?'青チームの得点！':'赤チームの得点');setTimeout(()=>{if(score[side]>=3){running=false;say(side===0?'青チームの勝利！':'赤チームの勝利。リセットで再戦')}else resetRound()},650)}
function update(dt){time+=dt;if(freeze>0){freeze-=dt;return}playerUpdate(dt);cpuUpdate(dt);slimeUpdate(dt);const ss=obstacles.find(o=>o.type==='seesaw');ss.tilt*=Math.pow(.16,dt);const d=dist(player,cpu);if(d<43&&player.z<18&&cpu.z<18){const n=norm(player.x-cpu.x,player.y-cpu.y),q=(43-d)*.5;player.x+=n.x*q;player.y+=n.y*q;cpu.x-=n.x*q;cpu.y-=n.y*q}}
function line(x1,y1,x2,y2,w,fill='#efb17e'){g.strokeStyle='#171717';g.lineWidth=w+6;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.strokeStyle=fill;g.lineWidth=w;g.stroke()}
function pose(p){const a=p.attack,kind=a?.kind,t=a?clamp(p.attackT/ATT[kind].dur,0,1):-1,walk=Math.sin(p.walkT)*p.moving;let lean=0,bodyX=0,rot=0,spinX=1,sk={x:-9-walk*7,y:22},sf={x:-13-walk*13,y:46},kk={x:10+walk*7,y:22},kf={x:16+walk*13,y:45},la={x:-25,y:-47},lah={x:-10,y:-64},ra={x:25,y:-48},rah={x:10,y:-66},straightArm=false;if(!p.onGround){sk={x:-10,y:18};sf={x:-18,y:34};kk={x:15,y:16};kf={x:25,y:31};lean=-.07}if(t>=0){const q=smooth(t);if(kind==='groundWeak'){if(t<.28){const u=smooth(t/.28);sk.y=lerp(22,31,u);kk.y=lerp(22,33,u);bodyX=lerp(0,-2,u)}else if(t<.58){const u=smooth((t-.28)/.30);kk={x:lerp(10,20,u),y:lerp(33,19,u)};kf={x:lerp(16,46,u),y:lerp(45,25,u)}}else{const u=smooth((t-.58)/.42);kk={x:lerp(20,10,u),y:lerp(19,22,u)};kf={x:lerp(46,16,u),y:lerp(25,45,u)}}}else if(kind==='groundStrong'){if(t<.32){const u=smooth(t/.32);sk={x:lerp(-9,10,u),y:22};sf={x:lerp(-13,15,u),y:45};bodyX=lerp(0,8,u)}else if(t<.58){const u=smooth((t-.32)/.26);lean=lerp(0,-.2,u);kk={x:lerp(10,-17,u),y:lerp(22,8,u)};kf={x:lerp(16,-36,u),y:lerp(45,5,u)}}else{const u=smooth((t-.58)/.42);lean=lerp(-.2,0,u);kk={x:lerp(-17,25,u),y:lerp(8,17,u)};kf={x:lerp(-36,63,u),y:lerp(5,31,u)}}}else if(kind==='straight'){if(t<.22){const u=smooth(t/.22);lean=lerp(0,.04,u);bodyX=lerp(0,-2,u);ra={x:lerp(25,20,u),y:lerp(-48,-49,u)};rah={x:lerp(10,14,u),y:lerp(-66,-64,u)};la={x:-25,y:-47};lah={x:-9,y:-65}}else if(t<.62){const u=smooth((t-.22)/.40);lean=lerp(.04,-.08,u);bodyX=lerp(-2,6,u);straightArm=true;rah={x:lerp(14,72,u),y:lerp(-64,-58,u)};ra={x:lerp(20,43,u),y:lerp(-49,-57,u)};la={x:-27,y:-46};lah={x:-11,y:-66}}else{const u=smooth((t-.62)/.38);lean=lerp(-.08,0,u);bodyX=lerp(6,0,u);straightArm=true;rah={x:lerp(72,10,u),y:lerp(-58,-66,u)};ra={x:lerp(43,25,u),y:lerp(-57,-48,u)};la={x:-25,y:-47};lah={x:-10,y:-64}}}else if(kind==='sideKick'){if(t<.30){const u=smooth(t/.30);lean=lerp(0,.10,u);kk={x:lerp(10,25,u),y:lerp(22,8,u)};kf={x:lerp(16,4,u),y:lerp(45,9,u)};sk={x:lerp(-9,-16,u),y:lerp(22,28,u)};sf={x:lerp(-13,-22,u),y:lerp(46,47,u)}}else if(t<.62){const u=smooth((t-.30)/.32);lean=lerp(.10,-.14,u);bodyX=lerp(0,5,u);kk={x:lerp(25,40,u),y:lerp(8,2,u)};kf={x:lerp(4,82,u),y:lerp(9,-13,u)};la={x:-23,y:-27};ra={x:24,y:-29}}else{const u=smooth((t-.62)/.38);lean=lerp(-.14,0,u);bodyX=lerp(5,0,u);kk={x:lerp(40,10,u),y:lerp(2,22,u)};kf={x:lerp(82,16,u),y:lerp(-13,45,u)}}}else if(kind==='double'){if(t<.30){const u=smooth(t/.30);lean=lerp(0,-.10,u);sk={x:lerp(-10,-2,u),y:lerp(18,8,u)};sf={x:lerp(-18,26,u),y:lerp(34,2,u)};kk={x:lerp(15,-5,u),y:lerp(16,28,u)};kf={x:lerp(25,-17,u),y:lerp(31,45,u)}}else if(t<.58){const u=smooth((t-.30)/.28);sk={x:lerp(-2,-15,u),y:lerp(8,25,u)};sf={x:lerp(26,-25,u),y:lerp(2,42,u)};kk={x:lerp(-5,38,u),y:lerp(28,0,u)};kf={x:lerp(-17,86,u),y:lerp(45,-15,u)};lean=lerp(-.10,-.18,u)}else{const u=smooth((t-.58)/.42);kk={x:lerp(38,20,u),y:lerp(0,17,u)};kf={x:lerp(86,20,u),y:lerp(-15,33,u)};sk={x:lerp(-15,-10,u),y:lerp(25,20,u)};sf={x:lerp(-25,-18,u),y:lerp(42,37,u)};lean=lerp(-.18,0,u)}}else if(kind==='airHead'){lean=-.30*Math.sin(Math.PI*q);la={x:-22,y:-24};ra={x:24,y:-30}}}return{lean,bodyX,rot,spinX,sk,sf,kk,kf,la,lah,ra,rah,straightArm}}
function blackLimb(x1,y1,x2,y2,w=11){g.strokeStyle='#171717';g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function fist(x,y,r=7){g.fillStyle='#171717';g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function shoe(x,y,ang=0){g.save();g.translate(x,y);g.rotate(ang);g.fillStyle='#fffdf3';g.strokeStyle='#171717';g.lineWidth=7;g.beginPath();g.ellipse(0,0,18,9,0,0,Math.PI*2);g.fill();g.stroke();g.restore()}
function roundRectPath(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath()}
function drawPerson(p){
 const x=p.x,y=p.y-p.z,bob=Math.sin(p.walkT*2)*1.5*p.moving,P=pose(p),f=p.face||1;
 g.save();g.translate(x,y+bob);g.scale(f,1);g.translate(P.bodyX,0);g.scale(P.spinX,1);g.rotate(P.rot);g.rotate(P.lean);
 // 影
 g.fillStyle='#29452e2d';g.beginPath();g.ellipse(0,52+p.z,32,8,0,0,Math.PI*2);g.fill();
 // 奥側の手足：黒い一本線
 blackLimb(-10,-51,P.la.x,P.la.y,12);blackLimb(P.la.x,P.la.y,P.lah.x,P.lah.y,11);fist(P.lah.x,P.lah.y,7);
 blackLimb(-7,-2,P.sk.x,P.sk.y,13);blackLimb(P.sk.x,P.sk.y,P.sf.x-3,P.sf.y-4,12);shoe(P.sf.x,P.sf.y,-.15);
 // 胴体：丸いユニフォーム
 g.fillStyle=p.color;g.strokeStyle='#171717';g.lineWidth=8;roundRectPath(-24,-76,48,74,16);g.fill();g.stroke();
 // 白い縦ライン（チーム色の識別を残しつつ参考画像寄り）
 g.save();roundRectPath(-24,-76,48,74,16);g.clip();g.fillStyle='#fff';g.fillRect(-9,-78,10,78);g.fillRect(10,-78,8,78);g.restore();
 // 手前側の腕
 if(P.straightArm){blackLimb(13,-55,P.rah.x,P.rah.y,12);fist(P.rah.x,P.rah.y,7)}else{blackLimb(13,-55,P.ra.x,P.ra.y,12);blackLimb(P.ra.x,P.ra.y,P.rah.x,P.rah.y,11);fist(P.rah.x,P.rah.y,7)};
 // 手前側の脚
 blackLimb(7,-2,P.kk.x,P.kk.y,13);blackLimb(P.kk.x,P.kk.y,P.kf.x-4,P.kf.y-4,12);shoe(P.kf.x,P.kf.y,-.08);
 // 丸い頭・目だけ
 g.fillStyle='#f1b27f';g.strokeStyle='#171717';g.lineWidth=9;g.beginPath();g.arc(0,-108,32,0,Math.PI*2);g.fill();g.stroke();
 g.fillStyle='#171717';g.beginPath();g.arc(-8,-108,4.8,0,Math.PI*2);g.arc(10,-108,4.8,0,Math.PI*2);g.fill();
 g.restore()
}
function drawSlime(){const y=slime.y-slime.z;g.fillStyle='#0003';g.beginPath();g.ellipse(slime.x,slime.y+17,34*Math.max(.15,1-slime.z/330),10*Math.max(.15,1-slime.z/330),0,0,Math.PI*2);g.fill();g.save();g.translate(slime.x,y);g.scale(1+slime.squash*.22,1-slime.squash*.18);g.fillStyle='#8ad968';g.strokeStyle='#171717';g.lineWidth=7;g.beginPath();g.moveTo(-34,17);g.quadraticCurveTo(-31,-22,0,-31);g.quadraticCurveTo(31,-22,34,17);g.quadraticCurveTo(18,34,0,30);g.quadraticCurveTo(-18,34,-34,17);g.closePath();g.fill();g.stroke();g.fillStyle='#171717';g.beginPath();g.arc(-11,-4,4.5,0,Math.PI*2);g.arc(11,-4,4.5,0,Math.PI*2);g.fill();g.restore()}
function drawObstacle(o){if(o.type==='grass'){for(let i=0;i<25;i++){const a=i*2.17,r=Math.sqrt((i+1)/25),x=o.x+Math.cos(a)*o.rx*r,y=o.y+Math.sin(a)*o.ry*r;g.strokeStyle=i%2?'#438d49':'#6bb65d';g.lineWidth=4;g.beginPath();g.moveTo(x,y+5);g.lineTo(x+Math.sin(i)*5,y-8-i%5);g.stroke()}return}if(o.type==='tree'){g.fillStyle='#8f603c';g.strokeStyle='#171717';g.lineWidth=6;g.fillRect(o.x-9,o.y-4,18,47);g.strokeRect(o.x-9,o.y-4,18,47);g.fillStyle='#68b257';g.beginPath();g.arc(o.x,o.y-18,34,0,Math.PI*2);g.fill();g.stroke();return}if(o.type==='rock'){g.fillStyle='#a0a39f';g.strokeStyle='#171717';g.lineWidth=6;g.beginPath();g.moveTo(o.x-28,o.y+16);g.lineTo(o.x-19,o.y-18);g.lineTo(o.x+5,o.y-27);g.lineTo(o.x+29,o.y-3);g.lineTo(o.x+21,o.y+21);g.closePath();g.fill();g.stroke();return}if(o.type==='step'){g.fillStyle='#9b7857';g.strokeStyle='#171717';g.lineWidth=6;g.fillRect(o.x-o.w/2,o.y-o.h/2+10,o.w,o.h);g.strokeRect(o.x-o.w/2,o.y-o.h/2+10,o.w,o.h);g.fillStyle='#dcc48c';g.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h-10);g.strokeRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h-10);return}if(o.type==='seesaw'){g.save();g.translate(o.x,o.y);g.rotate(o.tilt*.22);g.fillStyle='#e3aa4f';g.strokeStyle='#171717';g.lineWidth=7;g.fillRect(-o.len/2,-10,o.len,20);g.strokeRect(-o.len/2,-10,o.len,20);g.restore();g.fillStyle='#8d6d53';g.strokeStyle='#171717';g.lineWidth=6;g.beginPath();g.moveTo(o.x-18,o.y+27);g.lineTo(o.x,o.y-3);g.lineTo(o.x+18,o.y+27);g.closePath();g.fill();g.stroke()}}
function drawField(){const bg=g.createLinearGradient(0,0,W,0);bg.addColorStop(0,'#d8efb6');bg.addColorStop(.5,'#c3e6a4');bg.addColorStop(1,'#f0d3a6');g.fillStyle=bg;g.fillRect(0,0,W,H);g.fillStyle='#abd98b';g.fillRect(0,0,126,H);g.fillStyle='#e8c394';g.fillRect(W-126,0,126,H);g.save();g.translate(FIELD.cx,FIELD.cy);g.fillStyle='#bba2d4';g.beginPath();g.ellipse(0,0,FIELD.rx+22,FIELD.ry+22,0,0,Math.PI*2);g.fill();g.strokeStyle='#735a8f';g.lineWidth=9;g.stroke();g.restore();g.save();g.beginPath();g.ellipse(FIELD.cx,FIELD.cy,FIELD.rx,FIELD.ry,0,0,Math.PI*2);g.clip();const q=g.createRadialGradient(FIELD.cx,FIELD.cy,20,FIELD.cx,FIELD.cy,FIELD.rx);q.addColorStop(0,'#d5edb6');q.addColorStop(.78,'#acd48f');q.addColorStop(1,'#8fbd7e');g.fillStyle=q;g.fillRect(40,60,920,520);g.strokeStyle='#fffbd8';g.lineWidth=5;g.beginPath();g.ellipse(FIELD.cx,FIELD.cy,FIELD.rx-20,FIELD.ry-20,0,0,Math.PI*2);g.stroke();g.restore();g.fillStyle='#d5a566';g.strokeStyle='#171717';g.lineWidth=6;g.fillRect(27,FIELD.goalT,70,FIELD.goalB-FIELD.goalT);g.strokeRect(27,FIELD.goalT,70,FIELD.goalB-FIELD.goalT);g.fillRect(W-97,FIELD.goalT,70,FIELD.goalB-FIELD.goalT);g.strokeRect(W-97,FIELD.goalT,70,FIELD.goalB-FIELD.goalT);for(const o of obstacles)drawObstacle(o);const pulse=1+Math.sin(time*4)*.07;g.save();g.translate(FIELD.cx,FIELD.cy);g.scale(pulse,1/pulse);const pg=g.createRadialGradient(0,0,2,0,0,37);pg.addColorStop(0,'#f4ffff');pg.addColorStop(.32,'#91e5ca');pg.addColorStop(.82,'#775ba9');pg.addColorStop(1,'#2b163d00');g.fillStyle=pg;g.beginPath();g.arc(0,0,38,0,Math.PI*2);g.fill();g.restore();g.fillStyle='#27402d';g.font='900 15px sans-serif';g.textAlign='center';g.fillText('ぷれん村',63,42);g.fillText('となり村',937,42)}
function draw(){g.save();if(shake>0){g.translate(rand(-shake,shake),rand(-shake,shake));shake*=.82;if(shake<.3)shake=0}g.clearRect(-30,-30,W+60,H+60);drawField();[{y:slime.y,fn:drawSlime},{y:player.y,fn:()=>drawPerson(player)},{y:cpu.y,fn:()=>drawPerson(cpu)}].sort((a,b)=>a.y-b.y).forEach(o=>o.fn());if(flash>0){g.fillStyle=`rgba(255,255,255,${flash*5})`;g.fillRect(0,0,W,H);flash=Math.max(0,flash-.02)}g.restore()}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(running)update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyZ'){e.preventDefault();chooseAttack(player,'weak')}if(e.code==='KeyC'){e.preventDefault();chooseAttack(player,'strong')}if(e.code==='KeyX'){e.preventDefault();jump(player)}});window.addEventListener('keyup',e=>keys[e.code]=false);
function joyMove(e){if(joy.id===null)return;const p=[...e.touches].find(t=>t.identifier===joy.id);if(!p)return;const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=p.clientX-cx,dy=p.clientY-cy,max=r.width*.31,l=Math.hypot(dx,dy)||1,k=Math.min(max,l)/l;joy.x=dx/max*k;joy.y=dy/max*k;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`}
stick.addEventListener('touchstart',e=>{joy.id=e.changedTouches[0].identifier;joyMove(e)},{passive:false});stick.addEventListener('touchmove',e=>{e.preventDefault();joyMove(e)},{passive:false});function joyEnd(e){if([...e.changedTouches].some(t=>t.identifier===joy.id)){joy={x:0,y:0,id:null};knob.style.transform=''}}stick.addEventListener('touchend',joyEnd);stick.addEventListener('touchcancel',joyEnd);
weakBtn.addEventListener('pointerdown',e=>{e.preventDefault();chooseAttack(player,'weak')});strongBtn.addEventListener('pointerdown',e=>{e.preventDefault();chooseAttack(player,'strong')});jumpBtn.addEventListener('pointerdown',e=>{e.preventDefault();jump(player)});reset.addEventListener('click',()=>{running=true;resetGame()});start.addEventListener('click',()=>{intro.classList.add('hidden');running=true;last=performance.now();resetGame()});draw();requestAnimationFrame(loop);
})();
