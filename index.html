*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ecf8df;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#fff}body{display:grid;place-items:center}#wrap{position:relative;width:min(100vw,calc(100vh*1.6667));height:min(100vh,calc(100vw*.6));max-width:1100px;max-height:660px;background:#bde8a8;overflow:hidden;box-shadow:0 10px 35px #6a8f7244}canvas{display:block;width:100%;height:100%}#hud{position:absolute;inset:0;pointer-events:none}#title{position:absolute;left:50%;top:1.3%;transform:translateX(-50%);font-weight:1000;font-size:clamp(12px,1.9vw,22px);text-shadow:0 2px 0 #35613c,0 3px 5px #244d3566;white-space:nowrap}#score{position:absolute;left:50%;top:6.5%;transform:translateX(-50%);padding:4px 17px;border:4px solid #111;border-radius:999px;background:#fff;color:#111;font-weight:1000;font-size:clamp(15px,2.4vw,27px)}#msg{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);padding:6px 13px;border:3px solid #111;border-radius:999px;background:#fff;color:#111;font-weight:900;font-size:clamp(9px,1.2vw,14px);opacity:.95;white-space:nowrap}#stick{position:absolute;left:3%;bottom:6%;width:18%;aspect-ratio:1;border:4px solid #111;border-radius:50%;background:#ffffff77;pointer-events:auto}#knob{position:absolute;left:30%;top:30%;width:40%;height:40%;border:4px solid #111;border-radius:50%;background:#fff}button{font-family:inherit}#kick,#jump{position:absolute;aspect-ratio:1;border:5px solid #111;border-radius:50%;color:#111;font-weight:1000;box-shadow:inset 0 -7px 0 #0003;pointer-events:auto}#kick{right:4%;bottom:8%;width:16%;background:#ee745b;font-size:clamp(12px,2vw,23px)}#jump{right:19%;bottom:5%;width:12%;background:#ffd86a;font-size:clamp(10px,1.5vw,18px)}#kick:active,#jump:active{transform:translateY(3px)}#reset{position:absolute;right:2%;top:2%;border:3px solid #111;border-radius:12px;padding:7px 11px;background:#fff3a4;color:#111;f </style></head><body><div id="wrap"><canvas id="game" width="1000" height="600"></canvas><div id="hud"><div id="title">スライム・キックオフ2　PROTOTYPE v0.5</div><div id="score">0 - 0</div><div id="msg">仕掛けを使って、スライムを大きく飛ばそう</div><div id="stick"><div id="knob"></div></div><button id="jump">ジャンプ</button><button id="kick">キック</button><button id="reset">リセット</button></div><div id="intro"><div class="card"><h1>スライム・キックオフ2</h1><p>村と村の間の異次元から、無害だけど少し臭うスライムが湧き出しました。そこで両村は、スライムを隣村へ押しつける競技を始めます。</p><p><strong>今回はコートそのものが遊び場。</strong> シーソー、段差、草、木、石を利用して狙いを変えられます。</p><p>ジャンプ中にキックを押すと<strong>ヘディング</strong>。先に3点で勝利です。</p><button id="start">試作を開始</button><p class="note">移動：左スティック／WASD・矢印　キック：赤ボタン／Space　ジャンプ：黄ボタン／X</p></div></div></div><script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
const intro=document.getElementById('intro'),start=document.getElementById('start'),reset=document.getElementById('reset'),kickBtn=document.getElementById('kick'),jumpBtn=document.getElementById('jump'),stick=document.getElementById('stick'),knob=document.getElementById('knob'),scoreEl=document.getElementById('score'),msg=document.getElementById('msg');
let running=false,last=0,keys={},joy={x:0,y:0,id:null},score=[0,0],freeze=0,shake=0,flash=0,portalTime=0;
const FIELD={cx:500,cy:315,rx:440,ry:245,goalT:252,goalB:378};
const obstacles=[
 {type:'tree',x:315,y:205,r:31},{type:'tree',x:690,y:425,r:31},
 {type:'rock',x:690,y:205,r:27},{type:'rock',x:310,y:425,r:25},
 {type:'grass',x:420,y:185,rx:72,ry:38},{type:'grass',x:585,y:440,rx:78,ry:35},
 {type:'step',x:500,y:160,w:160,h:62,z:22},{type:'step',x:500,y:470,w:180,h:64,z:28},
 {type:'seesaw',x:500,y:315,len:190,angle:0,tilt:0,vel:0}
];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a),smooth=t=>t*t*(3-2*t),norm=(x,y)=>{const l=Math.hypot(x,y)||1;return{x:x/l,y:y/l}},dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function person(x,y,color,side){return{x,y,z:0,vz:0,onGround:true,color,side,dirX:side,dirY:0,speed:174,kickT:-1,kickDone:false,walkT:0,moving:0,stun:0,aiT:0,kickCd:0,platformZ:0}}
const player=person(245,355,'#56a9dc',1),cpu=person(755,275,'#e46f63',-1);
const slime={x:500,y:315,z:0,state:'idle',t:0,dur:0,sx:0,sy:0,sz:0,tx:0,ty:0,tz:0,h:0,next:.8,dodgeCd:0,squash:0,impactX:0,impactY:0};
function setMessage(t){msg.textContent=t}function updateScore(){scoreEl.textContent=`${score[0]} - ${score[1]}`}
function resetRound(){Object.assign(player,person(245,355,'#56a9dc',1));Object.assign(cpu,person(755,275,'#e46f63',-1));Object.assign(slime,{x:500,y:315,z:0,state:'idle',t:0,dur:0,sx:0,sy:0,sz:0,tx:0,ty:0,tz:0,h:0,next:.8,dodgeCd:0,squash:0,impactX:0,impactY:0});obstacles.find(o=>o.type==='seesaw').tilt=0;freeze=.45}
function resetGame(){score=[0,0];updateScore();resetRound();setMessage('仕掛けを使って、スライムを大きく飛ばそう')}
function constrainEllipse(o,margin=0){const dx=o.x-FIELD.cx,dy=o.y-FIELD.cy,rx=FIELD.rx-margin,ry=FIELD.ry-margin,q=(dx*dx)/(rx*rx)+(dy*dy)/(ry*ry);if(q>1){const k=1/Math.sqrt(q);o.x=FIELD.cx+dx*k;o.y=FIELD.cy+dy*k}return o}
function inRect(x,y,o,pad=0){return x>o.x-o.w/2-pad&&x<o.x+o.w/2+pad&&y>o.y-o.h/2-pad&&y<o.y+o.h/2+pad}
function groundHeightAt(x,y){let z=0;for(const o of obstacles)if(o.type==='step'&&inRect(x,y,o,-4))z=Math.max(z,o.z);return z}
function grassAt(x,y){return obstacles.some(o=>o.type==='grass'&&((x-o.x)**2/o.rx**2+(y-o.y)**2/o.ry**2<1))}
function resolveSolids(p,oldX,oldY){if(p.z>20)return;for(const o of obstacles){if(o.type!=='tree'&&o.type!=='rock')continue;const rr=o.r+21,dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy);if(d<rr){if(d<1){p.x=oldX;p.y=oldY}else{p.x=o.x+dx/d*rr;p.y=o.y+dy/d*rr}}}for(const o of obstacles){if(o.type!=='step')continue;if(inRect(p.x,p.y,o,18)&&p.z<o.z-4&&p.platformZ<o.z){p.x=oldX;p.y=oldY}}}
function slimeTarget(tx,ty){const inGoal=ty>FIELD.goalT&&ty<FIELD.goalB&&(tx<105||tx>895);if(inGoal)return{x:clamp(tx,30,W-30),y:clamp(ty,FIELD.goalT+8,FIELD.goalB-8)};return constrainEllipse({x:tx,y:ty},25)}
function launchSlime(tx,ty,h=75,dur=.65,state='jump',tz=0){const q=slimeTarget(tx,ty);slime.state=state;slime.t=0;slime.dur=dur;slime.sx=slime.x;slime.sy=slime.y;slime.sz=slime.z;slime.tx=q.x;slime.ty=q.y;slime.tz=tz;slime.h=h}
function requestKick(p){if(p.kickT<0&&p.stun<=0){p.kickT=0;p.kickDone=false}}
function requestJump(p){if(p.onGround&&p.kickT<0){p.vz=285;p.onGround=false;setMessage(p===player?'ジャンプ中にキックでヘディング':'')}}
function performAttack(p){const dx=slime.x-p.x,dy=slime.y-p.y,d=Math.hypot(dx,dy),f=(dx*p.dirX+dy*p.dirY)/(d||1);const isHead=!p.onGround&&p.z>18;if(d>(isHead?112:108)||f<(isHead?.30:.46)||Math.abs((p.z+44)-slime.z)>(isHead?75:70)||slime.state==='dodge')return false;if(slime.state==='idle'&&slime.dodgeCd<=0&&!isHead&&Math.random()<.04){const away=norm(dx,dy);launchSlime(slime.x+away.x*30,slime.y+away.y*30,16,.22,'dodge');slime.dodgeCd=4;setMessage('ぷるっ！ スライムが小さく避けた');return false}const aim=norm(p.dirX*.88+dx/(d||1)*.12,p.dirY*.88+dy/(d||1)*.12);const distance=isHead?rand(180,235):rand(145,195),height=isHead?rand(105,145):rand(78,112);launchSlime(slime.x+aim.x*distance,slime.y+aim.y*distance,height,isHead?rand(.72,.86):rand(.62,.76),isHead?'headed':'kicked');slime.squash=1;shake=isHead?12:8;flash=.1;freeze=.05;setMessage(isHead?'ヘディング！ 高く遠くへ飛んだ':'ナイスキック！ 前作より大きな放物線');return true}
function movePerson(p,mx,my,dt){const mag=Math.min(1,Math.hypot(mx,my));if(mag>.08&&p.kickT<0&&p.stun<=0){const n=norm(mx,my);if(Math.abs(n.x)>.12)p.side=n.x>=0?1:-1;p.dirX=lerp(p.dirX,n.x,.2);p.dirY=lerp(p.dirY,n.y,.2);const dn=norm(p.dirX,p.dirY);p.dirX=dn.x;p.dirY=dn.y;const slow=grassAt(p.x,p.y)?.62:1,air=p.onGround?1:.72;const ox=p.x,oy=p.y;p.x+=n.x*p.speed*mag*slow*air*dt;p.y+=n.y*p.speed*mag*slow*air*dt;resolveSolids(p,ox,oy);p.walkT+=dt*(6.7+mag*2);p.moving=lerp(p.moving,mag,.24)}else p.moving=lerp(p.moving,0,.2);constrainEllipse(p,40)}
function updateVertical(p,dt){if(!p.onGround){p.vz-=650*dt;p.z+=p.vz*dt;const g=groundHeightAt(p.x,p.y);if(p.z<=g){p.z=g;p.platformZ=g;p.vz=0;p.onGround=true}}else{const g=groundHeightAt(p.x,p.y);if(g<p.platformZ-3){p.onGround=false;p.vz=0}else{p.z=g;p.platformZ=g}}}
function updateKick(p,dt){if(p.kickT<0)return;p.kickT+=dt;const aerial=!p.onGround;if(!aerial&&p.kickT>.34&&p.kickT<.54){p.x+=p.dirX*42*dt;p.y+=p.dirY*42*dt}if(!p.kickDone&&p.kickT>=(aerial?.22:.58)){p.kickDone=true;performAttack(p)}if(p.kickT>=(aerial?.52:.9))p.kickT=-1}
function updatePlayer(dt){let mx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)+joy.x,my=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0)+joy.y;movePerson(player,mx,my,dt);updateVertical(player,dt);updateKick(player,dt)}
function updateCPU(dt){cpu.aiT-=dt;cpu.kickCd=Math.max(0,cpu.kickCd-dt);const goalX=48,toGoal=norm(goalX-slime.x,FIELD.cy-slime.y),behind={x:slime.x-toGoal.x*86,y:slime.y-toGoal.y*86};constrainEllipse(behind,48);let dx=behind.x-cpu.x,dy=behind.y-cpu.y,d=Math.hypot(dx,dy),mx=0,my=0;if(cpu.kickT<0){if(d>38){const n=norm(dx,dy);mx=n.x;my=n.y}else{const sd=dist(slime,cpu);cpu.dirX=toGoal.x;cpu.dirY=toGoal.y;if(slime.z>36&&sd<118&&cpu.onGround&&Math.random()<.025)requestJump(cpu);if(cpu.aiT<=0&&cpu.kickCd<=0&&sd<112){requestKick(cpu);cpu.aiT=rand(.85,1.2);cpu.kickCd=1.15}}}movePerson(cpu,mx,my,dt);updateVertical(cpu,dt);updateKick(cpu,dt)}
function seesawInteraction(){const s=obstacles.find(o=>o.type==='seesaw'),dx=slime.x-s.x,dy=slime.y-s.y,along=dx,across=dy;if(Math.abs(along)<s.len/2&&Math.abs(across)<25&&slime.state!=='idle'&&slime.z<20&&slime.t/slime.dur>.7){const side=Math.sign(along)||1;s.tilt=clamp(s.tilt+side*.9,-1,1);const dir=norm(side,rand(-.25,.25));launchSlime(slime.x+dir.x*rand(220,270),slime.y+dir.y*rand(120,180),rand(145,185),.9,'seesaw');shake=15;setMessage('シーソー発射！ 一気に大ジャンプ');return true}return false}
function updateSlime(dt){slime.dodgeCd=Math.max(0,slime.dodgeCd-dt);slime.squash=Math.max(0,slime.squash-dt*4.5);if(slime.state==='idle'){slime.z=groundHeightAt(slime.x,slime.y);slime.next-=dt;if(slime.next<=0){const n=norm(rand(-1,1),rand(-1,1)),d=rand(48,86);launchSlime(slime.x+n.x*d,slime.y+n.y*d,rand(48,72),rand(.55,.72),'jump',groundHeightAt(slime.x+n.x*d,slime.y+n.y*d));slime.next=rand(.8,1.5)}return}slime.t+=dt;const p=clamp(slime.t/slime.dur,0,1),e=smooth(p);slime.x=lerp(slime.sx,slime.tx,e);slime.y=lerp(slime.sy,slime.ty,e);slime.z=lerp(slime.sz,slime.tz,e)+Math.sin(p*Math.PI)*slime.h;if(seesawInteraction())return;if(p>=1){slime.x=slime.tx;slime.y=slime.ty;slime.z=groundHeightAt(slime.x,slime.y);slime.state='idle';slime.next=rand(.55,1.2);slime.squash=.5;checkGoal()}}
function checkGoal(){if(slime.y<FIELD.goalT||slime.y>FIELD.goalB)return;if(slime.x<54){score[1]++;goal(1)}else if(slime.x>946){score[0]++;goal(0)}}
function goal(side){updateScore();shake=16;freeze=.7;setMessage(side===0?'ゴール！ 青チームの得点':'ゴール。赤チームの得点');setTimeout(()=>{if(score[side]>=3){setMessage(side===0?'青チームの勝利！':'赤チームの勝利。リセットで再挑戦');running=false}else resetRound()},700)}
function update(dt){portalTime+=dt;if(freeze>0){freeze-=dt;return}updatePlayer(dt);updateCPU(dt);updateSlime(dt);const s=obstacles.find(o=>o.type==='seesaw');s.tilt*=Math.pow(.2,dt);if(dist(player,cpu)<45&&player.z<18&&cpu.z<18){const n=norm(player.x-cpu.x,player.y-cpu.y),push=(45-dist(player,cpu))*.5;player.x+=n.x*push;player.y+=n.y*push;cpu.x-=n.x*push;cpu.y-=n.y*push}}
function limb(x1,y1,x2,y2,w,skin=true){ctx.strokeStyle='#111';ctx.lineWidth=w+6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.strokeStyle=skin?'#efb17e':'#fffdf3';ctx.lineWidth=w;ctx.stroke()}
function drawPerson(p){const x=p.x,y=p.y-p.z,bob=Math.sin(p.walkT*2)*1.8*p.moving,walk=Math.sin(p.walkT)*p.moving;if(Math.abs(p.dirX)>.16)p.side=p.dirX>=0?1:-1;const f=p.side||1,kt=p.kickT<0?-1:clamp(p.kickT/(p.onGround?.9:.52),0,1);let bodyX=0,lean=0,supportKnee={x:-10-walk*6,y:22},supportFoot={x:-13-walk*12,y:46},kickKnee={x:12+walk*6,y:22},kickFoot={x:18+walk*12,y:45};if(!p.onGround){supportKnee={x:-10,y:17};supportFoot={x:-18,y:35};kickKnee={x:16,y:15};kickFoot={x:25,y:31};lean=-.08}else if(kt>=0){if(kt<.22){const q=smooth(kt/.22);supportFoot.x=lerp(-13,8,q);supportKnee.x=lerp(-10,1,q);bodyX=lerp(0,6,q)}else if(kt<.48){const q=smooth((kt-.22)/.26);lean=lerp(0,-.18,q);bodyX=lerp(6,12,q);supportFoot.x=8;supportKnee.x=1;kickKnee.x=lerp(12,-18,q);kickKnee.y=lerp(22,7,q);kickFoot.x=lerp(18,-39,q);kickFoot.y=lerp(45,3,q)}else if(kt<.68){const q=smooth((kt-.48)/.20);lean=lerp(-.18,-.25,q);bodyX=lerp(12,17,q);supportFoot.x=8;supportKnee.x=1;kickKnee.x=lerp(-18,22,q);kickKnee.y=lerp(7,17,q);kickFoot.x=lerp(-39,-5,q);kickFoot.y=lerp(3,28,q)}else{const q=smooth((kt-.68)/.32);lean=lerp(-.25,0,q);bodyX=lerp(17,0,q);supportFoot.x=lerp(8,-13,q);supportKnee.x=lerp(1,-10,q);kickKnee.x=lerp(22,12,q);kickKnee.y=lerp(17,22,q);kickFoot.x=lerp(58,18,q);kickFoot.y=lerp(37,45,q)}}ctx.save();ctx.translate(x,y+bob);ctx.scale(f,1);ctx.translate(bodyX,0);ctx.rotate(lean);ctx.fillStyle='#355b4430';ctx.beginPath();ctx.ellipse(0,43+p.z,31,8,0,0,Math.PI*2);ctx.fill();limb(-8,-2,supportKnee.x,supportKnee.y,12);limb(supportKnee.x,supportKnee.y,supportFoot.x-2,supportFoot.y-5,11,false);ctx.fillStyle='#fffdf3';ctx.strokeStyle='#161616';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(supportFoot.x,supportFoot.y,15,8,-.25,0,Math.PI*2);ctx.fill();ctx.stroke();limb(-14,-55,-22,-38,10);limb(-22,-38,-30,-16,9);ctx.fillStyle=p.color;ctx.strokeStyle='#161616';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-19,-74);ctx.quadraticCurveTo(9,-79,25,-62);ctx.lineTo(19,-7);ctx.quadraticCurveTo(0,3,-20,-6);ctx.closePath();ctx.fill();ctx.stroke();limb(13,-57,22,-39,10);limb(22,-39,30,-15,9);limb(7,-1,kickKnee.x,kickKnee.y,12);limb(kickKnee.x,kickKnee.y,kickFoot.x-5,kickFoot.y-5,11);ctx.fillStyle='#fffdf3';ctx.strokeStyle='#161616';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(kickFoot.x,kickFoot.y,17,8,-.1,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#f3b786';ctx.strokeStyle='#161616';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-22,-126);ctx.quadraticCurveTo(4,-141,27,-124);ctx.quadraticCurveTo(38,-110,27,-91);ctx.quadraticCurveTo(9,-78,-20,-88);ctx.quadraticCurveTo(-33,-105,-22,-126);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#161616';ctx.beginPath();ctx.arc(15,-108,5.5,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawSlime(){const y=slime.y-slime.z;ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(slime.x,slime.y+17,34*(1-slime.z/300),10*(1-slime.z/300),0,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(slime.x,y);let sx=1+slime.squash*.24,sy=1-slime.squash*.20;ctx.scale(sx,sy);ctx.fillStyle='#8ad968';ctx.strokeStyle='#111';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-34,17);ctx.quadraticCurveTo(-31,-22,0,-31);ctx.quadraticCurveTo(31,-22,34,17);ctx.quadraticCurveTo(18,34,0,30);ctx.quadraticCurveTo(-18,34,-34,17);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-11,-4,4.7,0,Math.PI*2);ctx.arc(11,-4,4.7,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawObstacle(o){if(o.type==='grass'){ctx.fillStyle='#4f9c55';for(let i=0;i<24;i++){const a=i*2.31,r=Math.sqrt((i+1)/24);const x=o.x+Math.cos(a)*o.rx*r,y=o.y+Math.sin(a)*o.ry*r;ctx.strokeStyle=i%2?'#3d8248':'#69b85f';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y+6);ctx.lineTo(x+Math.sin(i)*5,y-8-i%6);ctx.stroke()}return}if(o.type==='tree'){ctx.fillStyle='#8f603c';ctx.strokeStyle='#111';ctx.lineWidth=6;ctx.fillRect(o.x-9,o.y-5,18,48);ctx.strokeRect(o.x-9,o.y-5,18,48);ctx.fillStyle='#65ad55';ctx.beginPath();ctx.arc(o.x,o.y-18,35,0,Math.PI*2);ctx.fill();ctx.stroke();return}if(o.type==='rock'){ctx.fillStyle='#9c9f9a';ctx.strokeStyle='#111';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(o.x-28,o.y+15);ctx.lineTo(o.x-20,o.y-18);ctx.lineTo(o.x+5,o.y-27);ctx.lineTo(o.x+29,o.y-3);ctx.lineTo(o.x+21,o.y+21);ctx.closePath();ctx.fill();ctx.stroke();return}if(o.type==='step'){ctx.fillStyle='#9a7755';ctx.strokeStyle='#111';ctx.lineWidth=6;ctx.fillRect(o.x-o.w/2,o.y-o.h/2+10,o.w,o.h);ctx.strokeRect(o.x-o.w/2,o.y-o.h/2+10,o.w,o.h);ctx.fillStyle='#d9c08a';ctx.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h-10);ctx.strokeRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h-10);ctx.strokeStyle='#fff7c5';ctx.lineWidth=4;ctx.strokeRect(o.x-o.w/2+8,o.y-o.h/2+7,o.w-16,o.h-24);return}if(o.type==='seesaw'){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.tilt*.22);ctx.fillStyle='#e3aa4f';ctx.strokeStyle='#111';ctx.lineWidth=7;ctx.fillRect(-o.len/2,-10,o.len,20);ctx.strokeRect(-o.len/2,-10,o.len,20);ctx.restore();ctx.fillStyle='#8d6d53';ctx.strokeStyle='#111';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(o.x-18,o.y+28);ctx.lineTo(o.x,o.y-3);ctx.lineTo(o.x+18,o.y+28);ctx.closePath();ctx.fill();ctx.stroke()}}
function drawField(){const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#d6efad');g.addColorStop(.5,'#b9e3a0');g.addColorStop(1,'#f0d0a2');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#a8d886';ctx.fillRect(0,0,126,H);ctx.fillStyle='#e5bd8e';ctx.fillRect(W-126,0,126,H);ctx.save();ctx.translate(FIELD.cx,FIELD.cy);ctx.fillStyle='#b49bd0';ctx.beginPath();ctx.ellipse(0,0,FIELD.rx+22,FIELD.ry+22,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#745b91';ctx.lineWidth=9;ctx.stroke();ctx.restore();ctx.save();ctx.beginPath();ctx.ellipse(FIELD.cx,FIELD.cy,FIELD.rx,FIELD.ry,0,0,Math.PI*2);ctx.clip();const dirt=ctx.createRadialGradient(FIELD.cx,FIELD.cy,20,FIELD.cx,FIELD.cy,FIELD.rx);dirt.addColorStop(0,'#c9e8a7');dirt.addColorStop(.75,'#a9d28d');dirt.addColorStop(1,'#88ba7c');ctx.fillStyle=dirt;ctx.fillRect(45,65,910,510);ctx.strokeStyle='#fffbd8';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(FIELD.cx,FIELD.cy,FIELD.rx-20,FIELD.ry-20,0,0,Math.PI*2);ctx.stroke();ctx.restore();ctx.fillStyle='#d5a566';ctx.strokeStyle='#111';ctx.lineWidth=6;ctx.fillRect(27,FIELD.goalT,70,FIELD.goalB-FIELD.goalT);ctx.strokeRect(27,FIELD.goalT,70,FIELD.goalB-FIELD.goalT);ctx.fillRect(W-97,FIELD.goalT,70,FIELD.goalB-FIELD.goalT);ctx.strokeRect(W-97,FIELD.goalT,70,FIELD.goalB-FIELD.goalT);for(const o of obstacles)drawObstacle(o);const pulse=1+Math.sin(portalTime*4)*.08;ctx.save();ctx.translate(FIELD.cx,FIELD.cy);ctx.scale(pulse,1/pulse);const pg=ctx.createRadialGradient(0,0,2,0,0,39);pg.addColorStop(0,'#efffff');pg.addColorStop(.3,'#95ebcd');pg.addColorStop(.8,'#7659a8');pg.addColorStop(1,'#2b163d00');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(0,0,39,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#263c2b';ctx.font='900 15px sans-serif';ctx.textAlign='center';ctx.fillText('ぷれん村',64,42);ctx.fillText('となり村',936,42)}
function draw(){ctx.save();if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake*=.82;if(shake<.3)shake=0}ctx.clearRect(-30,-30,W+60,H+60);drawField();[{y:slime.y,fn:drawSlime},{y:player.y,fn:()=>drawPerson(player)},{y:cpu.y,fn:()=>drawPerson(cpu)}].sort((a,b)=>a.y-b.y).forEach(o=>o.fn());if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*5})`;ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-.02)}ctx.restore()}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(running)update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();requestKick(player)}if(e.code==='KeyX')requestJump(player)});window.addEventListener('keyup',e=>keys[e.code]=false);function joyMove(e){if(joy.id===null)return;const p=[...e.touches].find(t=>t.identifier===joy.id);if(!p)return;const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=p.clientX-cx,dy=p.clientY-cy,max=r.width*.31,l=Math.hypot(dx,dy)||1,k=Math.min(max,l)/l;joy.x=dx/max*k;joy.y=dy/max*k;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`}stick.addEventListener('touchstart',e=>{joy.id=e.changedTouches[0].identifier;joyMove(e)},{passive:false});stick.addEventListener('touchmove',e=>{e.preventDefault();joyMove(e)},{passive:false});function joyEnd(e){if([...e.changedTouches].some(t=>t.identifier===joy.id)){joy={x:0,y:0,id:null};knob.style.transform=''}}stick.addEventListener('touchend',joyEnd);stick.addEventListener('touchcancel',joyEnd);kickBtn.addEventListener('pointerdown',e=>{e.preventDefault();requestKick(player)});jumpBtn.addEventListener('pointerdown',e=>{e.preventDefault();requestJump(player)});reset.addEventListener('click',()=>{running=true;resetGame()});start.addEventListener('click',()=>{intro.classList.add('hidden');running=true;last=performance.now();resetGame()});draw();requestAnimationFrame(loop);
})();
